<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FreshKeeper 🥗</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green-dark:#14532d; --green:#166534; --green-mid:#15803d;
    --green-light:#f0fdf4; --green-border:#86efac;
    --orange:#c2410c; --orange-bg:#fff7ed; --orange-border:#fdba74;
    --red:#b91c1c; --red-bg:#fff1f2; --red-border:#fca5a5;
    --yellow:#a16207; --yellow-bg:#fefce8; --yellow-border:#fde047;
    --sand:#f5f2ed; --sand-border:#e5e0d8; --sand-dark:#ece8e1;
    --text:#111; --text-mid:#555; --text-light:#999;
    --font:'DM Sans',sans-serif; --font-serif:'DM Serif Display',serif;
  }
  html,body { font-family:var(--font); background:var(--sand); min-height:100vh; -webkit-font-smoothing:antialiased; }
  .app { max-width:430px; margin:0 auto; min-height:100vh; position:relative; background:var(--sand); }

  @keyframes fadeUp  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes bounce  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
  @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(-8px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }

  /* SETUP */
  #setup-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:32px 24px; text-align:center; }
  .setup-logo { font-size:64px; margin-bottom:16px; }
  .setup-title { font-family:var(--font-serif); font-size:32px; color:var(--green-dark); margin-bottom:8px; }
  .setup-sub { color:var(--text-light); font-size:15px; margin-bottom:32px; line-height:1.5; }
  .setup-card { background:white; border-radius:24px; padding:24px; width:100%; box-shadow:0 4px 32px rgba(0,0,0,.07); text-align:left; margin-bottom:16px; }
  .setup-card label { font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:.08em; display:block; margin-bottom:8px; }
  .setup-card input { width:100%; border:1.5px solid var(--sand-border); border-radius:14px; padding:13px 16px; font-size:14px; font-family:monospace; background:var(--sand); outline:none; color:var(--text); }
  .setup-hint { font-size:12px; color:var(--text-light); margin-top:8px; line-height:1.5; }
  .setup-hint a { color:var(--green-mid); }
  .btn-primary { width:100%; background:linear-gradient(135deg,var(--green),var(--green-dark)); color:white; border:none; border-radius:16px; padding:15px; font-size:16px; font-weight:700; font-family:var(--font); cursor:pointer; box-shadow:0 4px 18px rgba(22,101,52,.3); }

  /* HEADER */
  .header { background:linear-gradient(135deg,var(--green),var(--green-dark)); padding:20px 16px 16px; position:sticky; top:0; z-index:20; }
  .header-row { display:flex; align-items:flex-start; justify-content:space-between; }
  .header-title { font-family:var(--font-serif); font-size:24px; color:white; }
  .header-sub { color:rgba(255,255,255,.6); font-size:13px; margin-top:3px; }
  .header-settings { background:rgba(255,255,255,.18); border:none; color:white; border-radius:10px; width:36px; height:36px; font-size:17px; cursor:pointer; }
  .alert-bar { background:rgba(255,255,255,.12); border-radius:12px; padding:8px 12px; margin-top:12px; display:flex; gap:16px; }
  .alert-pill { font-size:13px; font-weight:600; }
  .alert-red{color:#fca5a5;} .alert-orange{color:#fdba74;}

  /* FILTER */
  .loc-bar { padding:12px 16px 4px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  .loc-bar::-webkit-scrollbar{display:none;}
  .loc-pill { white-space:nowrap; flex-shrink:0; padding:7px 14px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; border:1.5px solid var(--sand-border); background:white; color:#666; font-family:var(--font); transition:all .15s; }
  .loc-pill.active { background:var(--green); color:white; border-color:var(--green); }

  /* ITEMS */
  .items { padding:8px 16px 110px; display:flex; flex-direction:column; gap:10px; }
  .empty { text-align:center; padding:64px 24px; }
  .empty-icon { font-size:56px; margin-bottom:14px; }
  .empty-title { color:var(--text-mid); font-weight:700; font-size:17px; margin-bottom:6px; }
  .empty-sub { color:var(--text-light); font-size:14px; line-height:1.5; }

  .item-card { border-radius:18px; padding:12px 14px; display:flex; align-items:center; gap:12px; box-shadow:0 1px 5px rgba(0,0,0,.04); border:1.5px solid transparent; }
  .item-badge { border-radius:10px; padding:5px 8px; min-width:52px; text-align:center; font-size:12px; font-weight:800; color:white; flex-shrink:0; line-height:1.25; }
  .item-info { flex:1; min-width:0; }
  .item-name { font-weight:700; color:var(--text); font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item-meta { font-size:12px; color:var(--text-light); margin-top:2px; }
  .item-date { font-size:12px; font-weight:600; margin-top:3px; }
  .item-actions { display:flex; gap:4px; flex-shrink:0; }
  .item-edit { background:none; border:none; font-size:17px; cursor:pointer; padding:3px 5px; opacity:.5; }
  .item-delete { background:none; border:none; color:#d1c9be; font-size:22px; cursor:pointer; padding:0 3px; line-height:1; font-family:var(--font); }

  /* BOTTOM BAR */
  .bottom-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:white; border-top:1px solid var(--sand-dark); padding:10px 16px 24px; display:flex; gap:10px; z-index:20; }
  .btn-recipes { flex:1; background:var(--orange-bg); color:var(--orange); border:1.5px solid var(--orange-border); border-radius:16px; padding:13px 0; font-size:14px; font-weight:700; font-family:var(--font); cursor:pointer; }
  .btn-add-wrap { flex:1; position:relative; border-radius:16px; overflow:hidden; background:linear-gradient(135deg,var(--green),var(--green-dark)); box-shadow:0 4px 16px rgba(22,101,52,.38); display:flex; align-items:center; justify-content:center; color:white; font-size:14px; font-weight:700; padding:13px 0; }
  .btn-add-wrap input { position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; font-size:0; }

  /* ANALYZE SCREEN */
  #analyze-screen{display:none;}
  .back-btn { background:rgba(255,255,255,.18); border:none; color:white; border-radius:10px; width:36px; height:36px; font-size:19px; cursor:pointer; flex-shrink:0; }
  .preview-img { margin:16px 16px 0; border-radius:20px; overflow:hidden; height:200px; }
  .preview-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .analyzing-state { display:flex; flex-direction:column; align-items:center; padding:48px 24px; gap:14px; }
  .step-pill { background:rgba(22,101,52,.08); border-radius:12px; padding:8px 16px; font-size:13px; color:var(--green); font-weight:600; text-align:center; max-width:300px; }
  .form-area { padding:16px 16px 40px; display:flex; flex-direction:column; gap:14px; }
  .form-notice { border-radius:12px; padding:10px 14px; font-size:13px; line-height:1.4; }
  .form-notice.ok   { background:var(--green-light); border:1px solid var(--green-border); color:var(--green); }
  .form-notice.err  { background:#fffbeb; border:1px solid #fcd34d; color:#92400e; }
  .form-notice.info { background:#eff6ff; border:1px solid #93c5fd; color:#1d4ed8; }
  .form-label { font-size:11px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:.07em; display:block; margin-bottom:6px; }
  .form-input { width:100%; border:1.5px solid var(--sand-border); border-radius:14px; padding:12px 14px; font-size:15px; font-family:var(--font); background:white; outline:none; color:var(--text); }
  .form-select { width:100%; border:1.5px solid var(--sand-border); border-radius:14px; padding:12px 14px; font-size:15px; font-family:var(--font); background:white; outline:none; color:var(--text); appearance:none; }
  .loc-group { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .loc-btn { padding:8px 14px; border-radius:20px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font); border:1.5px solid var(--sand-border); background:white; color:#555; transition:all .15s; }
  .loc-btn.active { background:var(--green); color:white; border-color:var(--green); }

  /* MODALS */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:flex; align-items:flex-end; }
  .modal-sheet { background:white; border-radius:24px 24px 0 0; width:100%; max-width:430px; margin:0 auto; max-height:85vh; overflow:hidden; display:flex; flex-direction:column; animation:slideUp .28s ease; }
  .modal-header { padding:18px 20px; border-bottom:1px solid var(--sand-dark); display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .modal-title { font-weight:800; font-size:18px; color:var(--text); }
  .modal-close { background:var(--sand); border:none; border-radius:10px; width:32px; height:32px; font-size:18px; cursor:pointer; color:#666; }
  .modal-body { padding:20px; overflow-y:auto; flex:1; }
  .modal-loading { display:flex; flex-direction:column; align-items:center; padding:40px 0; gap:14px; }
  .recipes-text { color:#333; font-size:14px; line-height:1.8; white-space:pre-wrap; }
  .edit-form { display:flex; flex-direction:column; gap:14px; }

  /* TOAST */
  .toast { position:fixed; top:14px; left:50%; transform:translateX(-50%); background:rgba(17,17,17,.88); color:white; border-radius:22px; padding:10px 22px; font-size:14px; font-weight:600; z-index:100; white-space:nowrap; pointer-events:none; box-shadow:0 4px 20px rgba(0,0,0,.2); animation:toastIn .2s ease; }
</style>
</head>
<body>
<div class="app">

<!-- SETUP -->
<div id="setup-screen">
  <div class="setup-logo">🥗</div>
  <h1 class="setup-title">FreshKeeper</h1>
  <p class="setup-sub">Fotografa le confezioni,<br>tieni d'occhio le scadenze,<br>spreca meno cibo.</p>
  <div class="setup-card">
    <label for="api-key-input">Anthropic API Key</label>
    <input type="password" id="api-key-input" placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false">
    <p class="setup-hint">Salvata solo nel tuo browser. Ottienila su <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a></p>
  </div>
  <button class="btn-primary" id="setup-btn">Inizia →</button>
</div>

<!-- MAIN -->
<div id="main-screen" style="display:none">
  <div class="header">
    <div class="header-row">
      <div><div class="header-title">🥗 FreshKeeper</div><div class="header-sub" id="header-count">0 prodotti</div></div>
      <button class="header-settings" id="settings-btn">⚙️</button>
    </div>
    <div class="alert-bar" id="alert-bar" style="display:none"></div>
  </div>
  <div class="loc-bar" id="loc-bar"></div>
  <div class="items" id="items-list"></div>
  <div class="bottom-bar">
    <button class="btn-recipes" id="recipes-btn">🍳 Ricette antispreco</button>
    <div class="btn-add-wrap">📷 Aggiungi<input type="file" accept="image/*" id="file-input"></div>
  </div>
</div>

<!-- ANALYZE -->
<div id="analyze-screen">
  <div class="header">
    <div class="header-row">
      <button class="back-btn" id="back-btn">←</button>
      <h2 style="color:white;font-size:18px;font-weight:700;flex:1;margin-left:12px">Nuovo prodotto</h2>
    </div>
  </div>
  <div id="preview-wrap" class="preview-img" style="display:none"><img id="preview-img" src="" alt=""></div>
  <div id="analyzing-state" class="analyzing-state">
    <div style="font-size:52px;animation:bounce 1.1s ease-in-out infinite">🔍</div>
    <p style="color:var(--green);font-weight:700;font-size:19px">Analisi in corso…</p>
    <div class="step-pill" id="step-pill">Caricamento immagine</div>
  </div>
  <div id="form-area" class="form-area" style="display:none">
    <div class="form-notice ok" id="form-notice"></div>
    <div><label class="form-label">Nome prodotto *</label><input class="form-input" type="text" id="f-name" placeholder="Es: Latte intero, Yogurt fragola…"></div>
    <div>
      <label class="form-label">Categoria</label>
      <select class="form-select" id="f-category">
        <option>Latticini</option><option>Carne e Pesce</option><option>Frutta e Verdura</option>
        <option>Pasta e Cereali</option><option>Conserve</option><option>Bevande</option>
        <option>Surgelati</option><option>Dolci</option><option>Altro</option>
      </select>
    </div>
    <div><label class="form-label">Data di scadenza *</label><input class="form-input" type="date" id="f-date"></div>
    <div><label class="form-label">Dove si trova?</label><div class="loc-group" id="loc-group"></div></div>
    <button class="btn-primary" id="save-btn">Salva prodotto ✓</button>
  </div>
</div>

<!-- MODAL RICETTE -->
<div id="recipes-modal" class="modal-overlay" style="display:none">
  <div class="modal-sheet">
    <div class="modal-header"><span class="modal-title">🍳 Ricette antispreco</span><button class="modal-close" id="recipes-close">×</button></div>
    <div class="modal-body" id="recipes-body"></div>
  </div>
</div>

<!-- MODAL MODIFICA -->
<div id="edit-modal" class="modal-overlay" style="display:none">
  <div class="modal-sheet">
    <div class="modal-header"><span class="modal-title">✏️ Modifica prodotto</span><button class="modal-close" id="edit-close">×</button></div>
    <div class="modal-body">
      <div class="edit-form">
        <div><label class="form-label">Nome prodotto *</label><input class="form-input" type="text" id="e-name"></div>
        <div>
          <label class="form-label">Categoria</label>
          <select class="form-select" id="e-category">
            <option>Latticini</option><option>Carne e Pesce</option><option>Frutta e Verdura</option>
            <option>Pasta e Cereali</option><option>Conserve</option><option>Bevande</option>
            <option>Surgelati</option><option>Dolci</option><option>Altro</option>
          </select>
        </div>
        <div><label class="form-label">Data di scadenza *</label><input class="form-input" type="date" id="e-date"></div>
        <div><label class="form-label">Dove si trova?</label><div class="loc-group" id="e-loc-group"></div></div>
        <button class="btn-primary" id="edit-save-btn" style="margin-top:4px">Salva modifiche ✓</button>
      </div>
    </div>
  </div>
</div>

</div>
<div class="toast" id="toast" style="display:none"></div>

<script>
const LOCATIONS = ['Frigo','Dispensa','Freezer','Altro'];
const LOC_ICON  = { Frigo:'🧊', Dispensa:'🗄️', Freezer:'❄️', Altro:'🧺' };
const KEY_ITEMS = 'fk-items-v2';
const KEY_API   = 'fk-apikey';

const OFF_CAT_MAP = [
  { re:/dairy|milk|yogurt|cheese|cream|butter|latticin/i,  cat:'Latticini' },
  { re:/meat|fish|seafood|poultry|ham|salami|carne|pesce/i, cat:'Carne e Pesce' },
  { re:/fruit|vegetable|frutta|verdura/i,                   cat:'Frutta e Verdura' },
  { re:/pasta|rice|cereal|flour|bread|riso|farina/i,        cat:'Pasta e Cereali' },
  { re:/canned|conserv|jam|sauce|condiment/i,               cat:'Conserve' },
  { re:/beverage|drink|water|juice|wine|beer|coffee|tea/i,  cat:'Bevande' },
  { re:/frozen|ice.cream|surgelat/i,                        cat:'Surgelati' },
  { re:/cake|biscuit|sweet|chocolate|candy|snack/i,         cat:'Dolci' },
];
const OFF_LOC_MAP = [
  { re:/frozen|congel|surgelat/i, loc:'Freezer' },
  { re:/fridge|refrigerat|frigo|cold/i, loc:'Frigo' },
];

let items=[], filterLoc='Tutti', pendingItem=null, editingId=null, editingLoc=null;

const $ = id => document.getElementById(id);
function getDays(d){ if(!d)return 999; const t=new Date(); t.setHours(0,0,0,0); return Math.ceil((new Date(d+'T00:00:00')-t)/86400000); }
function urgency(d){
  if(d<0)   return{color:'#b91c1c',bg:'#fff1f2',border:'#fca5a5',label:'Scaduto',dc:'#b91c1c'};
  if(d===0) return{color:'#b91c1c',bg:'#fff1f2',border:'#fca5a5',label:'Oggi!',  dc:'#b91c1c'};
  if(d<=3)  return{color:'#c2410c',bg:'#fff7ed',border:'#fdba74',label:`${d}g`,  dc:'#c2410c'};
  if(d<=7)  return{color:'#a16207',bg:'#fefce8',border:'#fde047',label:`${d}g`,  dc:'#a16207'};
  return          {color:'#15803d',bg:'#f0fdf4',border:'#86efac',label:`${d}g`,  dc:'#15803d'};
}
function fmtDate(d){ if(!d)return'—'; const[y,m,dd]=d.split('-'); return`${dd}/${m}/${y}`; }
let toastT;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>el.style.display='none',2800); }
function save(){ localStorage.setItem(KEY_ITEMS,JSON.stringify(items)); }
function load(){ try{items=JSON.parse(localStorage.getItem(KEY_ITEMS))||[];}catch{items=[];} items.sort((a,b)=>new Date(a.expiryDate)-new Date(b.expiryDate)); }
function getKey(){ return localStorage.getItem(KEY_API)||''; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setSelect(id,val){ const s=$(id); for(let i=0;i<s.options.length;i++) if(s.options[i].value===val){s.selectedIndex=i;return;} }

function buildLocs(containerId, activeVal, onChange){
  const lg=$(containerId); lg.innerHTML='';
  LOCATIONS.forEach(loc=>{
    const b=document.createElement('button');
    b.className='loc-btn'+(activeVal===loc?' active':'');
    b.textContent=`${LOC_ICON[loc]} ${loc}`;
    b.addEventListener('click',()=>{ onChange(loc); lg.querySelectorAll('.loc-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
    lg.appendChild(b);
  });
}

function show(id){
  ['setup-screen','main-screen','analyze-screen'].forEach(s=>$(s).style.display=s===id?'block':'none');
  if(id==='main-screen') render();
}

// ── SETUP
$('setup-btn').addEventListener('click',()=>{
  const k=$('api-key-input').value.trim();
  if(!k.startsWith('sk-')){toast('⚠️ Chiave non valida');return;}
  localStorage.setItem(KEY_API,k); show('main-screen');
});
$('api-key-input').addEventListener('keydown',e=>{if(e.key==='Enter')$('setup-btn').click();});
$('settings-btn').addEventListener('click',()=>{ $('api-key-input').value=getKey(); show('setup-screen'); });

// ── DASHBOARD
function render(){
  $('header-count').textContent=`${items.length} prodott${items.length===1?'o':'i'} tracciati`;
  const exp=items.filter(i=>getDays(i.expiryDate)<0).length;
  const soon=items.filter(i=>{const d=getDays(i.expiryDate);return d>=0&&d<=3;}).length;
  const ab=$('alert-bar');
  if(exp>0||soon>0){
    ab.style.display='flex'; ab.innerHTML='';
    if(exp){const s=document.createElement('span');s.className='alert-pill alert-red';s.textContent=`🔴 ${exp} scadut${exp===1?'o':'i'}`;ab.appendChild(s);}
    if(soon){const s=document.createElement('span');s.className='alert-pill alert-orange';s.textContent=`🟠 ${soon} in scadenza`;ab.appendChild(s);}
  } else ab.style.display='none';

  const lb=$('loc-bar'); lb.innerHTML='';
  ['Tutti',...LOCATIONS].forEach(loc=>{
    const b=document.createElement('button');
    b.className='loc-pill'+(filterLoc===loc?' active':'');
    b.textContent=loc==='Tutti'?'📦 Tutti':`${LOC_ICON[loc]} ${loc}`;
    b.addEventListener('click',()=>{filterLoc=loc;render();});
    lb.appendChild(b);
  });

  const list=$('items-list'); list.innerHTML='';
  const filtered=filterLoc==='Tutti'?items:items.filter(i=>i.location===filterLoc);
  if(filtered.length===0){
    list.innerHTML=`<div class="empty"><div class="empty-icon">🛒</div><p class="empty-title">Nessun prodotto</p><p class="empty-sub">Premi 📷 Aggiungi per fotografare<br>la prima confezione</p></div>`;
    return;
  }
  filtered.forEach((item,i)=>{
    const d=getDays(item.expiryDate), u=urgency(d);
    const card=document.createElement('div');
    card.className='item-card';
    card.style.cssText=`background:${u.bg};border-color:${u.border};animation:fadeUp .25s ease ${i*.04}s both`;
    card.innerHTML=`
      <div class="item-badge" style="background:${u.color}">${u.label}</div>
      <div class="item-info">
        <div class="item-name">${esc(item.name)}</div>
        <div class="item-meta">${LOC_ICON[item.location]} ${item.location} · ${esc(item.category)}</div>
        <div class="item-date" style="color:${u.dc}">📅 Scade il ${fmtDate(item.expiryDate)}</div>
      </div>
      <div class="item-actions">
        <button class="item-edit" data-id="${item.id}">✏️</button>
        <button class="item-delete" data-id="${item.id}">×</button>
      </div>`;
    list.appendChild(card);
  });
  list.querySelectorAll('.item-edit').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openEdit(b.dataset.id);}));
  list.querySelectorAll('.item-delete').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    items=items.filter(i=>i.id!=b.dataset.id);
    save(); render(); toast('🗑️ Prodotto rimosso');
  }));
}

// ── EDIT MODAL
function openEdit(id){
  const item=items.find(i=>i.id==id); if(!item)return;
  editingId=id; editingLoc=item.location;
  $('e-name').value=item.name;
  setSelect('e-category',item.category);
  $('e-date').value=item.expiryDate||'';
  buildLocs('e-loc-group',item.location,loc=>{editingLoc=loc;});
  $('edit-modal').style.display='flex';
}
$('edit-close').addEventListener('click',()=>{$('edit-modal').style.display='none';editingId=null;});
$('edit-modal').addEventListener('click',e=>{if(e.target===$('edit-modal')){$('edit-modal').style.display='none';editingId=null;}});
$('edit-save-btn').addEventListener('click',()=>{
  const name=$('e-name').value.trim(), date=$('e-date').value;
  if(!name){toast('⚠️ Inserisci il nome');return;}
  if(!date){toast('⚠️ Inserisci la data');return;}
  const item=items.find(i=>i.id==editingId); if(!item)return;
  item.name=name; item.category=$('e-category').value; item.expiryDate=date; item.location=editingLoc;
  items.sort((a,b)=>new Date(a.expiryDate)-new Date(b.expiryDate));
  save(); $('edit-modal').style.display='none'; editingId=null; render(); toast('✅ Modifiche salvate!');
});

// ── BARCODE
async function detectBarcode(imgEl){
  if(!('BarcodeDetector' in window))return null;
  try{
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
    const res=await det.detect(imgEl);
    return res.length>0?res[0].rawValue:null;
  }catch{return null;}
}

async function lookupOFF(barcode){
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
    const d=await r.json();
    if(d.status!==1)return null;
    const p=d.product;
    const name=p.product_name_it||p.product_name||p.product_name_en||'';
    if(!name)return null;
    const cats=(p.categories_tags||[]).join(' ');
    let category='Altro';
    for(const row of OFF_CAT_MAP){if(row.re.test(cats)){category=row.cat;break;}}
    const conserv=(p.conservation_conditions||'')+' '+cats;
    let location='Dispensa';
    for(const row of OFF_LOC_MAP){if(row.re.test(conserv)){location=row.loc;break;}}
    return{name,category,location};
  }catch{return null;}
}

async function claudeVision(b64,mime,onlyDate){
  const prompt=onlyDate
    ?"Guarda questa confezione. Trovami SOLO la data di scadenza (TMC, da consumarsi entro, use by, best before). Rispondi SOLO con JSON: {\"expiryDate\":\"YYYY-MM-DD oppure null\"}"
    :"Analizza questa confezione alimentare. Rispondi SOLO con JSON, nessun markdown:\n{\"name\":\"nome prodotto in italiano\",\"category\":\"una tra: Latticini|Carne e Pesce|Frutta e Verdura|Pasta e Cereali|Conserve|Bevande|Surgelati|Dolci|Altro\",\"expiryDate\":\"YYYY-MM-DD oppure null\"}";
  const resp=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:200,messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:mime,data:b64}},
      {type:'text',text:prompt}
    ]}]})
  });
  const data=await resp.json();
  if(data.error)throw new Error(data.error.message);
  return JSON.parse(data.content[0].text.replace(/```[a-z]*|```/g,'').trim());
}

function setStep(msg){$('step-pill').textContent=msg;}

// ── ANALYZE FLOW
$('file-input').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file)return;
  e.target.value='';

  const url=URL.createObjectURL(file);
  $('preview-img').src=url; $('preview-wrap').style.display='block';
  show('analyze-screen');
  $('analyzing-state').style.display='flex'; $('form-area').style.display='none';

  pendingItem={id:Date.now(),name:'',category:'Altro',expiryDate:'',location:'Frigo',addedDate:new Date().toISOString().split('T')[0]};

  let msg='', type='ok', barcodeUsed=false;

  try{
    // 1. Barcode detection
    setStep('🔎 Cerco barcode nell\'immagine…');
    const imgEl=$('preview-img');
    await new Promise(res=>{if(imgEl.complete)res();else imgEl.onload=res;});
    const barcode=await detectBarcode(imgEl);

    let off=null;
    if(barcode){
      setStep(`📦 Barcode ${barcode} trovato — cerco su Open Food Facts…`);
      off=await lookupOFF(barcode);
    }

    if(off){
      barcodeUsed=true;
      pendingItem.name=off.name; pendingItem.category=off.category; pendingItem.location=off.location;
    }

    // 2. Claude per la data (sempre) e nome/categoria se no barcode
    setStep('🤖 Claude legge la data di scadenza…');
    const b64=await new Promise(res=>{const r=new FileReader();r.onload=ev=>res(ev.target.result.split(',')[1]);r.readAsDataURL(file);});
    const cl=await claudeVision(b64,file.type,barcodeUsed);

    if(cl.expiryDate) pendingItem.expiryDate=cl.expiryDate;
    if(!barcodeUsed){ pendingItem.name=cl.name||''; pendingItem.category=cl.category||'Altro'; }

    if(barcodeUsed){
      msg=cl.expiryDate
        ?`✅ Barcode + data letti — verifica se serve`
        :`⚠️ Prodotto identificato via barcode, data non leggibile — inseriscila manualmente`;
      type=cl.expiryDate?'ok':'err';
    } else {
      msg='✅ Analisi completata — verifica e correggi se serve'; type='ok';
    }
  }catch(err){
    msg='⚠️ '+(err.message||'Errore — controlla la API key'); type='err';
  }

  $('analyzing-state').style.display='none'; $('form-area').style.display='flex';
  const notice=$('form-notice'); notice.textContent=msg; notice.className='form-notice '+type;
  $('f-name').value=pendingItem.name;
  setSelect('f-category',pendingItem.category);
  $('f-date').value=pendingItem.expiryDate||'';
  buildLocs('loc-group',pendingItem.location,loc=>{pendingItem.location=loc;});
});

$('back-btn').addEventListener('click',()=>{pendingItem=null;show('main-screen');});

$('save-btn').addEventListener('click',()=>{
  const name=$('f-name').value.trim(), date=$('f-date').value;
  const notice=$('form-notice');
  if(!name){notice.textContent='⚠️ Inserisci il nome del prodotto';notice.className='form-notice err';return;}
  if(!date){notice.textContent='⚠️ Inserisci la data di scadenza';notice.className='form-notice err';return;}
  pendingItem.name=name; pendingItem.category=$('f-category').value; pendingItem.expiryDate=date;
  items.push(pendingItem);
  items.sort((a,b)=>new Date(a.expiryDate)-new Date(b.expiryDate));
  save(); show('main-screen'); toast('✅ Prodotto salvato!');
});

// ── RECIPES
$('recipes-btn').addEventListener('click',async()=>{
  const exp=items.filter(i=>{const d=getDays(i.expiryDate);return d>=0&&d<=5;});
  if(exp.length===0){toast('Nessun prodotto in scadenza entro 5 giorni 👍');return;}
  $('recipes-modal').style.display='flex';
  $('recipes-body').innerHTML=`<div class="modal-loading"><div style="font-size:48px;animation:bounce 1.1s ease-in-out infinite">👨‍🍳</div><p style="color:#999;font-size:14px">Il cuoco sta pensando…</p></div>`;
  const list=exp.map(i=>`${i.name} (scade tra ${getDays(i.expiryDate)} giorni)`).join(', ');
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1200,
        messages:[{role:'user',content:`Ho questi ingredienti in scadenza: ${list}.\n\nSuggerisci 3 ricette semplici per evitare gli sprechi. Per ognuna: nome, ingredienti usati, 3-4 passaggi brevi. Sii pratico e conciso.`}]
      })
    });
    const data=await resp.json();
    $('recipes-body').innerHTML=`<div class="recipes-text">${esc(data.content[0].text)}</div>`;
  }catch{
    $('recipes-body').innerHTML=`<p style="color:#999;text-align:center;padding:24px">Errore. Riprova.</p>`;
  }
});
$('recipes-close').addEventListener('click',()=>$('recipes-modal').style.display='none');
$('recipes-modal').addEventListener('click',e=>{if(e.target===$('recipes-modal'))$('recipes-modal').style.display='none';});

// ── BOOT
load();
if(getKey())show('main-screen'); else show('setup-screen');
</script>
